<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>横並びワークスペース</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <main id="popup" aria-busy="true">
    <header><h1>横並びワークスペース</h1><span class="badge">候補版</span></header>
    <div class="workspace-row">
      <button id="toggle-workspace" class="primary" type="button" aria-pressed="false" disabled>横並びを開始</button>
      <span id="pane-count" class="muted">状態を確認中</span>
    </div>

    <fieldset id="workspace-controls" disabled>
      <legend class="sr-only">列の操作</legend>
      <div class="layout-row">
        <button id="add-pane" type="button">＋ 新しいチャット</button>
        <label class="check"><input id="equal-columns" type="checkbox">列を等分</label>
      </div>
      <form id="width-form" class="control-form">
        <label for="pane-width">列幅</label>
        <div class="input-row"><input id="pane-width" type="number" min="320" max="920" step="1" inputmode="numeric" required aria-describedby="width-help"><span class="unit" aria-hidden="true">px</span><button id="apply-width" type="submit">適用</button></div>
        <p id="width-help" class="help">320〜920 px。等分中は手動変更できません。</p>
      </form>
      <form id="url-form" class="control-form">
        <label for="chat-url">会話URLを右端に追加</label>
        <div class="input-row"><input id="chat-url" type="text" maxlength="2048" required autocomplete="off" spellcheck="false" placeholder="https://chatgpt.com/…"><button id="add-url" type="submit">追加</button></div>
      </form>
      <form id="restore-form" class="control-form">
        <label for="hidden-panes">隠した列</label>
        <div class="input-row"><select id="hidden-panes" disabled><option value="">隠した列はありません</option></select><button id="restore-pane" type="submit" disabled>戻す</button></div>
      </form>
    </fieldset>

    <p id="status" role="status" aria-live="polite" aria-atomic="true">現在のタブに接続しています…</p>
    <div class="footer-actions"><button id="retry-status" type="button" hidden>接続を再試行</button><button id="open-options" type="button">その他の設定</button></div>
    <footer>↻ はその列だけ再読み込み（未送信入力が消える場合あり）。別端末との同期を保証するものではありません。</footer>
  </main>
</body>
</html>
